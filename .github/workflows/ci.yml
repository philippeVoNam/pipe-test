name: CI/CD Production Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'

jobs:
  # --------------------------------------------------------
  # STAGE 1: THE CI JOB (Runs tests on Linux)
  # --------------------------------------------------------
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest flake8

    - name: Run Unit Tests
      run: pytest

  # --------------------------------------------------------
  # STAGE 2: THE CD JOB (Compiles Standalone Binary on Ubuntu)
  # --------------------------------------------------------
  continuous-deployment:
    runs-on: ubuntu-latest
    needs: continuous-integration
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install App and Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compile Executable with PyInstaller
      run: |
        # --onefile: Bundles everything into a single standalone binary
        # Change 'pipe_test/main.py' to match your actual entry-point script!
        pyinstaller --onefile pipe_test/main.py --name "PipeTest"

    - name: Create Automated GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        # Linux executable binaries do not use a file extension like .exe
        files: dist/PipeTest
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
