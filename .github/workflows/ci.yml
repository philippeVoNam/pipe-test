name: CI/CD Production Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*' # Triggers on tags like v1.0.0, v1.1.2

jobs:
  # --------------------------------------------------------
  # STAGE 1: THE CI JOB (Runs on every push to main and every tag)
  # --------------------------------------------------------
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest flake8

    - name: Lint Code (Check style and syntax)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Unit Tests
      run: pytest

  # --------------------------------------------------------
  # STAGE 2: THE CD JOB (Only runs if CI passes AND it's a tag)
  # --------------------------------------------------------
  continuous-deployment:
    runs-on: ubuntu-latest
    # CRUCIAL: This links CI and CD together. CD will wait for CI to pass.
    needs: continuous-integration
    
    # SAFETY NET: Only execute this job if we explicitly pushed a version tag
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write # Allows GitHub to upload files to your Release page

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build Downloadable Packages
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build # Compiles your code into assets (dist/ folder)

    - name: Create Automated GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
