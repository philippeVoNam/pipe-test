name: Python Integration and Validation

# 1. Trigger: Run this pipeline every time someone pushes to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    # 2. Runner: Use a fresh Linux environment managed by GitHub
    runs-on: ubuntu-latest

    steps:
    # 3. Steps: The actual recipe of tasks to execute
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up future runs by caching downloads

    - name: Install Project Dependencies
      run: |
        python -m pip upgrade pip
        pip install -r requirements.txt

    - name: Run Code Linter (Check Formatting)
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Automated Tests
      run: |
        pip install pytest
        pytest
