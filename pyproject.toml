[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipe_test"
description = "An internal utility tool for the team"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# 1. Tell the project that the version and dependencies are dynamic
dynamic = ["version", "dependencies"]

[tool.setuptools]
packages = ["pipe_test"]

# 2. Tell setuptools exactly where to find the dynamic data
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
version = { attr = "pipe_test.__version__" }
